; Supervisor keeps the queue workers running and starts them again if they stop.
; Copy to /etc/supervisor/conf.d/topup.conf, then:
;   sudo mkdir -p /var/log/topup && sudo chown deploy:deploy /var/log/topup
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
;
; HOW MANY CUSTOMERS CAN GET A PAYMENT QR AT THE SAME TIME = numprocs of topup-payway.
; Each one runs its own Chromium browser, so it needs real memory. Change the number, then run:
;   sudo supervisorctl update    then    sudo supervisorctl status
;
; Timing rule (a test checks it): PAYWAY_SESSION_SECONDS (200) < --timeout (300) < DB_QUEUE_RETRY_AFTER (420) in .env
; stopwaitsecs must be longer than --timeout so a stop waits for a payment session to finish.

[program:topup-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/topup/artisan queue:work --queue=default --sleep=1 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/topup
user=deploy
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/topup/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:topup-payway]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/topup/artisan queue:work --queue=payway --sleep=1 --tries=3 --max-time=3600 --timeout=300
directory=/var/www/topup
user=deploy
numprocs=3
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=330
stopasgroup=true
killasgroup=true
environment=HOME="/home/deploy"
redirect_stderr=true
stdout_logfile=/var/log/topup/worker-payway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[group:topup]
programs=topup-default,topup-payway
