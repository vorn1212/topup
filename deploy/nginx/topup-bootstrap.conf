# STEP 1 of 2: use this file ONLY until the HTTPS certificate exists.
# It serves the site on plain HTTP and lets Let's Encrypt prove you own the domain.
# Replace YOUR_DOMAIN everywhere (example: shop.example.com). Then switch to topup.conf (see deploy/DEPLOY-GUIDE.md).

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/topup/public;
    index index.php;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm-topup.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
