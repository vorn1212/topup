# STEP 2 of 2: the real site configuration (HTTP redirects to HTTPS).
# Copy to /etc/nginx/sites-available/topup, replace YOUR_DOMAIN everywhere, then:
#   sudo ln -s /etc/nginx/sites-available/topup /etc/nginx/sites-enabled/topup
#   sudo nginx -t && sudo systemctl reload nginx
# The socket name comes from deploy/php/topup-pool.conf (PHP 8.3 on Ubuntu 24.04). Check: ls /run/php/

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers must use HTTPS for a year. Only turn this on after HTTPS works.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/topup/public;
    index index.php;
    charset utf-8;

    # Logos and game pictures are small; nothing here needs more.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only index.php may run as PHP. Any other .php file is a 404.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm-topup.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve .env, .git and other hidden files (Let's Encrypt's folder is the only exception).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Uploaded pictures can never be executed as code.
    location ~* ^/storage/.*\.(php|phtml|phar)$ {
        deny all;
    }

    # Long browser cache for pictures, fonts and the built css/js (their names change when they change).
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|gif|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
