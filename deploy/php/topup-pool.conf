; A PHP-FPM pool just for this shop. Copy to /etc/php/8.3/fpm/pool.d/topup.conf, then:
;   sudo mv /etc/php/8.3/fpm/pool.d/www.conf /etc/php/8.3/fpm/pool.d/www.conf.disabled
;   sudo systemctl restart php8.3-fpm
;
; The website, the queue workers, cron and the deploy script all run as the SAME user (deploy),
; so a log or cache file made by one of them can always be written by the others.
; Nginx (www-data) only reads public/ and talks to PHP through the socket below.

[topup]
user = deploy
group = deploy

listen = /run/php/php8.3-fpm-topup.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Starting point for a 4 GB server. If "pm.max_children" is reached the log says so: then raise it, or add memory.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

catch_workers_output = yes
clear_env = yes
